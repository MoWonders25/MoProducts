<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
body{width:1080px;height:1080px;font-family:'Helvetica Neue',Arial,sans-serif;overflow:hidden}
.t{width:1080px;height:1080px;position:relative;padding:70px;display:flex;flex-direction:column}
.paid{background:linear-gradient(160deg,#2b2420 0%,#3d2a1d 100%);color:#fbf5ea}
.free{background:#fbf5ea;color:#2b2420}
.badge{align-self:flex-start;font-weight:800;font-size:30px;letter-spacing:2px;padding:12px 26px;border-radius:999px;background:#d9631e;color:#fff}
.free .badge{background:#6f7f5c}
h1{font-size:118px;line-height:.95;font-weight:900;margin-top:36px;letter-spacing:-2px}
h1 span{color:#d9631e}
.sub{font-family:Georgia,serif;font-size:38px;margin-top:22px;max-width:560px;line-height:1.25;opacity:.9}
.doc{position:absolute;right:60px;bottom:150px;width:380px;transform:rotate(5deg);border-radius:10px;box-shadow:0 20px 50px rgba(0,0,0,.45);border:6px solid #fff}
.face{position:absolute;left:70px;bottom:60px;display:flex;align-items:center;gap:20px}
.face img{width:120px;height:120px;border-radius:50%;border:5px solid #d9631e;object-fit:cover}
.face div{font-size:30px;font-weight:700}.face small{display:block;font-weight:400;font-size:24px;opacity:.75}
.price{position:absolute;right:70px;bottom:60px;font-size:64px;font-weight:900;background:#d9631e;color:#fff;padding:10px 30px;border-radius:20px}
</style></head><body>
<div class="t PAGECLASS">
  <div class="badge">BADGE</div>
  <h1>TITLE</h1>
  <div class="sub">SUB</div>
  <img class="doc" src="DOC">
  <div class="face"><img src="holly.jpg"><div>Holly Bramble<small>@hollybrambledaysathome</small></div></div>
  PRICE
</div></body></html>
